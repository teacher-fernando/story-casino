        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 35%, #3b0764 0%, #1e1b4b 55%, #090514 100%);
            color: #ffffff;
            user-select: none;
            height: 100vh;
            width: 100vw;
        }
        .font-casino {
            font-family: 'Fredoka', sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            cursor: grab;
        }
        #canvas-container:active {
            cursor: grabbing;
        }
        #canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .casino-btn {
            background: linear-gradient(180deg, #fde047 0%, #eab308 50%, #ca8a04 100%);
            box-shadow: 0 6px 0 #854d0e, 0 12px 24px rgba(0,0,0,0.65), inset 0 2px 3px rgba(255,255,255,0.85);
            transition: transform 0.1s ease, filter 0.1s ease, box-shadow 0.1s ease;
            will-change: transform;
        }
        .casino-btn:hover {
            filter: brightness(1.07);
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #854d0e, 0 16px 28px rgba(234, 179, 8, 0.45), inset 0 2px 3px rgba(255,255,255,0.9);
        }
        .casino-btn:active, .casino-btn.spinning {
            transform: translateY(4px) !important;
            box-shadow: 0 2px 0 #854d0e, 0 4px 10px rgba(0,0,0,0.5);
        }
        .hud-pill {
            background: rgba(15, 23, 42, 0.78);
            border: 1px solid rgba(250, 204, 21, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
        }

        let bgmStarted = false;
        let isPageVisible = true;

        const MAX_CONFETTI = 45;
        let confettiPool = [];
        let activeConfettiCount = 0;

        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };
        let targetRot = { x: 0.04, y: 0 };

        let lastTickTime = 0;

            { spinning: false, velocity: 0, targetAngle: 0, stopTime: 0 },

        document.addEventListener('visibilitychange', () => {

            } else if (bgmLoop) {

        // ============================================================================
        // ÁUDIO E MÚSICA IDLE/LOOP DE FUNDO OTIMIZADOS
        // ============================================================================
        let polySynth, tickSynth, bgmSynth, bgmBass, bgmLoop;
        let bgmStep = 0;

        const BGM_CHORDS = [
            ["C4", "E4", "G4", "B4"],
            ["A3", "C4", "E4", "G4"],
            ["F3", "A3", "C4", "E4"],
            ["G3", "B3", "D4", "F4"]
        ];
        const BGM_BASS_NOTES = ["C2", "G2", "A2", "E2", "F2", "C2", "G2", "D2"];
        const BGM_MELODY = ["E5", null, "G5", "A5", "G5", null, "E5", "C5", "D5", null, "F5", "E5", "D5", null, "B4", "G4"];

        function initAudio() {
            if (polySynth) {
                if (Tone.context.state !== 'running') {
                    Tone.context.resume();
                }
                syncBackgroundMusic();
                return;
            }
            try {
                if (Tone.context.state !== 'running') {
                    Tone.context.resume();
                }
                polySynth = new Tone.PolySynth(Tone.Synth, {
                    maxPolyphony: 6,
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.01, decay: 0.12, sustain: 0.08, release: 0.25 }
                }).toDestination();
                polySynth.volume.value = -9;

                tickSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.008,
                    octaves: 2,
                    envelope: { attack: 0.001, decay: 0.03, sustain: 0 }
                }).toDestination();
                tickSynth.volume.value = -14;

                // Sintetizadores super leves para a Música Idle/Lounge de Cassino
                bgmSynth = new Tone.PolySynth(Tone.Synth, {
                    maxPolyphony: 4,
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.04, decay: 0.3, sustain: 0.2, release: 0.6 }
                }).toDestination();
                bgmSynth.volume.value = -20;

                bgmBass = new Tone.Synth({
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.02, decay: 0.2, sustain: 0.15, release: 0.3 }
                }).toDestination();
                bgmBass.volume.value = -17;

                Tone.Transport.bpm.value = 108;
                bgmLoop = new Tone.Loop((time) => {
                    if (isMuted || !isMusicPlaying || !isPageVisible) return;

                    // Acorde suave no início de cada compasso
                    if (bgmStep % 4 === 0) {
                        const chord = BGM_CHORDS[Math.floor(bgmStep / 4) % BGM_CHORDS.length];
                        bgmSynth.triggerAttackRelease(chord, "2n", time);
                    }
                    // Walking bass leve a cada 2 passos
                    if (bgmStep % 2 === 0) {
                        const bassNote = BGM_BASS_NOTES[Math.floor(bgmStep / 2) % BGM_BASS_NOTES.length];
                        bgmBass.triggerAttackRelease(bassNote, "8n", time);
                    }
                    // Melodia alegre e discreta
                    const melNote = BGM_MELODY[bgmStep % BGM_MELODY.length];
                    if (melNote) {
                        bgmSynth.triggerAttackRelease(melNote, "16n", time);
                    }
                    bgmStep = (bgmStep + 1) % 16;
                }, "8n").start(0);

                bgmStarted = true;
                syncBackgroundMusic();
            } catch (e) {}
        }

        function syncBackgroundMusic() {
            if (!bgmStarted) return;
            try {
                if (!isMuted && isMusicPlaying && isPageVisible) {
                    if (Tone.Transport.state !== 'started') {
                        Tone.Transport.start();
                    }
                } else {
                    if (Tone.Transport.state === 'started') {
                        Tone.Transport.pause();
                    }
                }
            } catch (e) {}
        }

        function playTickSound(freq = 220) {
            if (isMuted || !isPageVisible) return;
            const now = performance.now();
            // Evita sobrecarga de áudio limitando a no máximo 15 cliques sonoros por segundo
            if (now - lastTickTime < 65) return;
            lastTickTime = now;
            try {
                initAudio();
                tickSynth.triggerAttackRelease(freq, "32n");
            } catch (e) {}
        }

        function playReelStopSound(reelIndex) {
            if (isMuted || !isPageVisible) return;
            try {
                initAudio();
                const notes = ["C4", "E4", "G4"];
                polySynth.triggerAttackRelease(notes[reelIndex], "16n");
            } catch (e) {}

        function playJackpotFanfare() {

            try {
                initAudio();
                const now = Tone.now();
                polySynth.triggerAttackRelease(["C4", "E4", "G4"], "8n", now);

        // ============================================================================
        // TEXTURAS REUTILIZÁVEIS (COM LETREIRO EM ARCO ENCAIXADO NA MÁQUINA)
        // ============================================================================
        function createFittedArchMarqueeTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, 1024, 512);

            const cx = 512;
            const cy = 492;
            const radius = 456;

            // Desenha meio-círculo perfeito que encaixa na cúpula superior da máquina
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, radius, Math.PI, 0, false);
            ctx.closePath();
            ctx.clip();

            // Fundo gradiente estilo cassino clássico
            const grad = ctx.createRadialGradient(cx, cy - 120, 40, cx, cy, radius);
            grad.addColorStop(0, '#1e40af');
            grad.addColorStop(0.55, '#172554');
            grad.addColorStop(1, '#090d16');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 512);

            // Raios de luz suaves saindo do centro do arco
            ctx.strokeStyle = 'rgba(250, 204, 21, 0.12)';
            ctx.lineWidth = 18;
            for (let a = Math.PI; a <= Math.PI * 2; a += Math.PI / 10) {
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
                ctx.stroke();
            }

            // Borda dourada acompanhando a curvatura exata da máquina
            ctx.beginPath();
            ctx.arc(cx, cy, radius - 10, Math.PI, 0, false);
            ctx.closePath();
            ctx.lineWidth = 18;
            ctx.strokeStyle = '#facc15';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, radius - 26, Math.PI + 0.06, -0.06, false);
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#fde047';
            ctx.stroke();

            // Estrelas decorativas laterais
            ctx.font = 'bold 48px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#facc15';
            ctx.fillText('★', 210, 355);
            ctx.fillText('★', 814, 355);
            ctx.fillText('✦', 512, 115);

            // Título "STORY" bem destacado no arco
            ctx.font = '900 112px "Fredoka", sans-serif';
            ctx.fillStyle = '#78350f';
            ctx.fillText('STORY', cx, 248);

            const goldGrad = ctx.createLinearGradient(0, 175, 0, 295);
            goldGrad.addColorStop(0, '#fef08a');
            goldGrad.addColorStop(0.5, '#facc15');
            goldGrad.addColorStop(1, '#ea580c');
            ctx.fillStyle = goldGrad;
            ctx.fillText('STORY', cx, 240);
            ctx.lineWidth = 5;
            ctx.strokeStyle = '#fffbeb';
            ctx.strokeText('STORY', cx, 240);

            // Subtítulo "CASINO" encaixado na base larga do arco (Sem menção a 60FPS)
            ctx.font = '900 94px "Fredoka", sans-serif';
            ctx.fillStyle = '#78350f';
            ctx.fillText('CASINO', cx, 368);

            const casinoGrad = ctx.createLinearGradient(0, 310, 0, 415);
            casinoGrad.addColorStop(0, '#ffffff');
            casinoGrad.addColorStop(0.5, '#fde047');
            casinoGrad.addColorStop(1, '#f59e0b');
            ctx.fillStyle = casinoGrad;
            ctx.fillText('CASINO', cx, 360);

            ctx.restore();

            const tex = new THREE.CanvasTexture(canvas);
            tex.needsUpdate = true;
            return tex;
        }

        function drawReelSlot(ctx, tex, item, slotIndex, slotW, slotH) {
            const x0 = slotIndex * slotW;

            // Pintura base imediata
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x0, 0, slotW, slotH);
            ctx.fillStyle = '#eff6ff';
            ctx.fillRect(x0 + 10, 10, slotW - 20, slotH - 20);
            ctx.strokeStyle = item.categoryColor || '#1d4ed8';
            ctx.lineWidth = 8;
            ctx.strokeRect(x0 + 14, 14, slotW - 28, slotH - 28);

            const emoji = String(item.emoji || '⭐');

            // Desenha emoji nativo imediatamente (zero atraso)
            const renderNativeFallback = () => {
                ctx.save();
                ctx.translate(x0 + slotW / 2, slotH / 2);
                ctx.rotate(Math.PI / 2);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = '140px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
                ctx.fillStyle = '#0f172a';
                ctx.fillText(emoji, 0, 0);
                ctx.restore();
                tex.needsUpdate = true;
            };

            // Se já estiver no cache, usa a imagem vetorial imediatamente
            if (emojiImageCache.has(emoji)) {
                const cachedImg = emojiImageCache.get(emoji);
                if (cachedImg.complete && cachedImg.naturalWidth > 0) {
                    ctx.save();
                    ctx.translate(x0 + slotW / 2, slotH / 2);
                    ctx.rotate(Math.PI / 2);
                    ctx.drawImage(cachedImg, -95, -72, 190, 144);
                    ctx.restore();
                    tex.needsUpdate = true;
                    return;
                }
            }

            renderNativeFallback();

            // Carrega Twemoji em background apenas 1 vez por emoji e salva no cache
            if (!emojiImageCache.has(emoji)) {
                const codepoints = Array.from(emoji)
                    .map(ch => ch.codePointAt(0).toString(16))
                    .filter(cp => cp !== 'fe0f')
                    .join('-');
                const img = new Image();
                img.crossOrigin = 'anonymous';
                emojiImageCache.set(emoji, img);
                img.onload = () => {
                    ctx.fillStyle = '#eff6ff';
                    ctx.fillRect(x0 + 18, 18, slotW - 36, slotH - 36);
                    ctx.save();
                    ctx.translate(x0 + slotW / 2, slotH / 2);
                    ctx.rotate(Math.PI / 2);
                    ctx.drawImage(img, -95, -72, 190, 144);
                    ctx.restore();
                    tex.needsUpdate = true;
                };
                img.src = `https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/${codepoints}.png`;
            }
        }

        // Atualiza o canvas existente do rolo sem alocar nova memória na placa de vídeo
        function updateReelTextureInPlace(reelIndex, itemsList) {
            const slotW = 256;
            const slotH = 256;
            const ctx = reelContexts[reelIndex];
            const tex = reelTextures[reelIndex];
            if (!ctx || !tex) return;

            for (let i = 0; i < itemsList.length; i++) {
                drawReelSlot(ctx, tex, itemsList[i], i, slotW, slotH);
            }
            tex.needsUpdate = true;
        }

        function pickRandomPoolForReel(count = 4) {
            const categories = Object.keys(WORD_BANK);
            const result = [];
            const usedEmojis = new Set();

            while (result.length < count) {
                const catKey = categories[Math.floor(Math.random() * categories.length)];
                const catObj = WORD_BANK[catKey];
                const randomItem = catObj.items[Math.floor(Math.random() * catObj.items.length)];
                if (!usedEmojis.has(randomItem.emoji)) {
                    usedEmojis.add(randomItem.emoji);
                    result.push({
                        ...randomItem,
                        categoryKey: catKey,
                        categoryName: catObj.label,
                        categoryColor: catObj.color
                    });
                }
            }
            return result;
        }

        function updateHUDCards() {
            for (let r = 0; r < 3; r++) {
                const item = currentResults[r];
                if (!item) continue;
                document.getElementById(`card-emoji-${r}`).textContent = item.emoji;
                const cardEl = document.getElementById(`card-${r}`);
                cardEl.style.borderBottomColor = item.categoryColor;
            }
        }

        function initConfettiPool() {
            const colors = [0xfacc15, 0xef4444, 0x3b82f6, 0x10b981, 0xec4899, 0xa855f7];
            const sharedGeo = new THREE.PlaneGeometry(0.18, 0.18);

            for (let i = 0; i < MAX_CONFETTI; i++) {
                const p = new THREE.Mesh(sharedGeo, sharedMats[i % sharedMats.length]);
                p.visible = false;
                p.userData = { vx: 0, vy: 0, vz: 0, rx: 0, ry: 0, life: 0 };
                scene.add(p);
                confettiPool.push(p);
            }
        }

        function spawn3DConfetti() {

                const p = confettiPool[i];
                p.position.set((Math.random() - 0.5) * 5.2, 1.1 + Math.random() * 1.4, 1.8 + Math.random() * 1.1);

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            if (!container || !renderer) return;
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        function setupCanvasInteractions(container) {
            let downTime = 0;
            let startPos = { x: 0, y: 0 };
            const raycaster = new THREE.Raycaster();
            const pointer = new THREE.Vector2();

            container.addEventListener('pointerdown', (e) => {
                // Ignora cliques em botões HTML da interface para nunca disparar giro acidental!
                if (e.target !== renderer.domElement) return;
                initAudio();
                isDragging = true;
                downTime = performance.now();
                prevMouse.x = e.clientX;
                prevMouse.y = e.clientY;
                startPos.x = e.clientX;
                startPos.y = e.clientY;
            }, { passive: true });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - prevMouse.x;
                const dy = e.clientY - prevMouse.y;
                prevMouse.x = e.clientX;
                prevMouse.y = e.clientY;

                targetRot.y = Math.max(-0.55, Math.min(0.55, targetRot.y + dx * 0.005));
                targetRot.x = Math.max(-0.22, Math.min(0.32, targetRot.x + dy * 0.004));
            }, { passive: true });

            window.addEventListener('pointerup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                if (e.target !== renderer.domElement) return;

                const elapsed = performance.now() - downTime;
                const moveDist = Math.hypot(e.clientX - startPos.x, e.clientY - startPos.y);

                // Se foi um clique rápido no canvas 3D
                if (elapsed < 250 && moveDist < 10) {
                    const rect = renderer.domElement.getBoundingClientRect();
                    pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                    pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                    raycaster.setFromCamera(pointer, camera);

                    // Verifica se o usuário clicou em um dos 3 botões físicos de HOLD na máquina 3D
                    const holdHits = raycaster.intersectObjects(holdBtnCapMeshes, false);
                    if (holdHits.length > 0) {
                        const reelIdx = holdHits[0].object.userData.holdReelIndex;
                        if (reelIdx !== undefined) {
                            toggleLockReel(reelIdx);
                            return;
                        }
                    }

                    // Caso contrário, gira os rolos destravados
                    triggerSpin();
                }
            }, { passive: true });
        }

        function resetCameraAngle() {
            targetRot.x = 0.04;
            targetRot.y = 0;
        }

        // ============================================================================
        // LÓGICA DE GIRO E TRAVAMENTO CORRIGIDA DOS ROLOS (HOLD REELS)
        // ============================================================================
        function triggerSpin(onlyReelIndex = null) {
            if (isSpinning || reelContexts.length < 3) return;
            initAudio();

            // Se todos os 3 rolos estiverem travados, não destrava à força: faz um efeito sonoro de aviso nos botões de trava
            if (onlyReelIndex === null && lockedReels[0] && lockedReels[1] && lockedReels[2]) {
                playTickSound(150);
                for (let i = 0; i < 3; i++) {
                    const btn = document.getElementById(`lock-${i}`);
                    btn.classList.add('scale-110');
                    setTimeout(() => btn.classList.remove('scale-110'), 200);
                }
                return;
            }

            isSpinning = true;
            const spinBtn = document.getElementById('spin-btn');
            const spinText = document.getElementById('spin-btn-text');
            const promptHud = document.getElementById('prompt-hud');

            spinBtn.classList.add('spinning');
            spinText.textContent = "SPINNING...";
            promptHud.style.opacity = '0.45';

            leverAnimState.active = true;
            leverAnimState.phase = 0;

            if (spinButtonMesh) {
                spinButtonMesh.position.y = -2.22;
            }

            const now = performance.now();
            let spinOrder = 0;

            for (let r = 0; r < 3; r++) {
                if (onlyReelIndex !== null && onlyReelIndex !== r) continue;
                // Se o rolo estiver travado (HOLD), preserva exatamente sua textura, ângulo e emoji!
                if (onlyReelIndex === null && lockedReels[r]) {
                    reelSpinState[r].spinning = false;
                    continue;
                }

                reelStripItems[r] = pickRandomPoolForReel(4);
                updateReelTextureInPlace(r, reelStripItems[r]);
                currentResults[r] = reelStripItems[r][0];

                const fullRotations = 4 + spinOrder * 2;
                const currentRot = reelMeshes[r].rotation.x;
                const nextMultiple = Math.ceil(currentRot / (Math.PI * 2)) * (Math.PI * 2);

                reelSpinState[r].spinning = true;
                reelSpinState[r].velocity = 0.36 + spinOrder * 0.03;
                // Para exatamente no primeiro item (slot 0) alinhado para o jogador
                reelSpinState[r].targetAngle = nextMultiple + fullRotations * Math.PI * 2 + Math.PI / 4;
                reelSpinState[r].stopTime = now + 950 + spinOrder * 450;
                spinOrder++;
            }
        }

        function toggleLockReel(index) {
            if (isSpinning) return; // Evita alterar travas no meio do giro
            initAudio();
            playTickSound(lockedReels[index] ? 260 : 420);

            lockedReels[index] = !lockedReels[index];
            const isLocked = lockedReels[index];

            // Atualiza botão inferior de Hold
            const btn = document.getElementById(`lock-${index}`);
            const icon = document.getElementById(`lock-icon-${index}`);
            const badge = document.getElementById(`card-lock-badge-${index}`);

            if (isLocked) {
                icon.textContent = "🔒";
                btn.className = "px-3 py-1 rounded-full bg-amber-400 text-slate-950 border border-amber-200 text-xs font-extrabold flex items-center gap-1.5 transition shadow-md";
                if (badge) badge.classList.remove('hidden');
            } else {
                icon.textContent = "🔓";
                btn.className = "px-3 py-1 rounded-full bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs font-bold flex items-center gap-1.5 transition";
                if (badge) badge.classList.add('hidden');
            }

            // Atualiza também o botão físico 3D na máquina (abaixa e brilha em verde/dourado quando travado)
            if (holdBtnCapMeshes[index]) {
                holdBtnCapMeshes[index].position.y = isLocked ? -2.26 : -2.20;
                holdBtnCapMeshes[index].material.color.setHex(isLocked ? 0x22c55e : 0xf59e0b);
            }
        }

        function toggleMute() {
            initAudio();
            isMuted = !isMuted;
            document.getElementById('sound-btn').textContent = isMuted ? '🔇' : '🔊';
            syncBackgroundMusic();
        }

        // ============================================================================
        // LOOP DE ANIMAÇÃO 60FPS CRAVADOS (COM DELTA TIME E PAUSA EM SEGUNDO PLANO)
        // ============================================================================
        let lastBulbToggle = 0;
        let bulbPhase = false;

        function animateLoop(now) {
            requestAnimationFrame(animateLoop);

            // Pausa completamente a renderização quando a aba está oculta para economizar CPU/GPU
            if (!isPageVisible || !renderer) return;

            const dt = Math.min((now - lastFrameTime) / 16.667, 2.5);
            lastFrameTime = now;

            // Rotação suave da câmera/máquina
            if (machineGroup) {
                machineGroup.rotation.y += (targetRot.y - machineGroup.rotation.y) * 0.12 * dt;
                machineGroup.rotation.x += (targetRot.x - machineGroup.rotation.x) * 0.12 * dt;
            }

            // Animação da alavanca lateral
            if (leverAnimState.active && leverPivotGroup) {
                leverAnimState.phase += 0.12 * dt;
                if (leverAnimState.phase <= Math.PI) {
                    leverPivotGroup.rotation.x = Math.sin(leverAnimState.phase) * 1.15;
                } else {
                    leverPivotGroup.rotation.x = 0;
                    leverAnimState.active = false;
                    if (spinButtonMesh) spinButtonMesh.position.y = -2.14;
                }
            }

            // Pisca as lâmpadas trocando apenas 2 materiais compartilhados
            const bulbInterval = isSpinning ? 120 : 420;
            if (now - lastBulbToggle > bulbInterval) {
                lastBulbToggle = now;
                bulbPhase = !bulbPhase;
                if (bulbMatEven && bulbMatOdd) {
                    bulbMatEven.color.setHex(bulbPhase ? 0xffffff : 0xd97706);
                    bulbMatOdd.color.setHex(bulbPhase ? 0xd97706 : 0xffffff);
                }
            }

            // Atualiza destaque dourado nos rolos travados (HOLD)
            for (let r = 0; r < 3; r++) {
                if (reelLockBadgeMeshes[r]) {
                    const targetOp = lockedReels[r] ? 0.32 : 0.0;
                    reelLockBadgeMeshes[r].material.opacity += (targetOp - reelLockBadgeMeshes[r].material.opacity) * 0.15 * dt;
                }
            }

            // Física de giro dos 3 rolos
            let anyStillSpinning = false;
            for (let r = 0; r < 3; r++) {
                const state = reelSpinState[r];
                if (state.spinning && reelMeshes[r]) {
                    anyStillSpinning = true;
                    const mesh = reelMeshes[r];

                    if (now < state.stopTime) {
                        mesh.rotation.x += state.velocity * dt;
                        playTickSound(210 + r * 55);
                    } else {
                        const diff = state.targetAngle - mesh.rotation.x;
                        if (Math.abs(diff) > 0.008) {
                            mesh.rotation.x += diff * 0.18 * dt;
                        } else {
                            mesh.rotation.x = state.targetAngle % (Math.PI * 2);
                            state.spinning = false;
                            playReelStopSound(r);
                        }
                    }
                }
            }

            // Quando todos os rolos terminam de parar
            if (isSpinning && !anyStillSpinning) {
                isSpinning = false;
                const spinBtn = document.getElementById('spin-btn');
                const spinText = document.getElementById('spin-btn-text');
                const promptHud = document.getElementById('prompt-hud');

                spinBtn.classList.remove('spinning');
                spinText.textContent = "SPIN AGAIN!";
                promptHud.style.opacity = '1';

                updateHUDCards();
                playJackpotFanfare();
                spawn3DConfetti();
            }

            // Atualiza pool fixo de confetes sem alocar memória
            if (activeConfettiCount > 0) {
                let alive = 0;
                for (let i = 0; i < MAX_CONFETTI; i++) {
                    const p = confettiPool[i];
                    if (!p.visible) continue;
                    p.position.x += p.userData.vx * dt;
                    p.position.y += p.userData.vy * dt;
                    p.position.z += p.userData.vz * dt;
                    p.userData.vy -= 0.0045 * dt;
                    p.rotation.x += p.userData.rx * dt;
                    p.rotation.y += p.userData.ry * dt;
                    p.userData.life -= dt;

                    if (p.userData.life <= 0) {
                        p.visible = false;
                    } else {
                        alive++;
                    }
                }
                activeConfettiCount = alive;
            }

            renderer.render(scene, camera);
        }

        // Inicialização imediata e segura da cena 3D e do loop de 60FPS
        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', () => {
                initThreeJS();
                requestAnimationFrame(animateLoop);
            });
        } else {
            initThreeJS();
            requestAnimationFrame(animateLoop);
        }
    </script>
</body>
</html>
